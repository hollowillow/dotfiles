###############
### WINDOWS ###
###############

# https://wiki.hypr.land/Configuring/Window-Rules/
windowrule {
        name = browser
        match:class = ^($BROWSER)$
        workspace = 2
}

windowrule {
        name = mpv
        match:class = ^(mpv)$
        workspace = 3
        fullscreen = on
        # no_initial_focus = on
        opaque = on
}

windowrule {
        name = steam
        match:class = ^(steam)$
        workspace = 4
        # no_initial_focus = on
        fullscreen = on
}

windowrule {
        name = retroarch
        match:class = .*RetroArch.*
        workspace = 4
        workspace = 4
        fullscreen = on
}

windowrule {
        name = discord
        match:class = .*discord.*
        workspace = special:scratchpad
}

windowrule {
        name = term-menu
        match:class = ^(script.term_menu)$
        workspace = special:term-menu
        stay_focused = on
        float = on
        size = 1000 500
        border_color = rgb(7daea3)
        opacity = 1
        animation = gnomed
}

windowrule {
        name = invisible
        match:class = ^(script.invisible)$
        border_color = rgb(7daea3)
        opacity = 0
        no_anim = on
        no_blur = on
        no_shadow = on
}

windowrule {
        name = keepassxc
        match:class = .*KeePassXC.*
        workspace = special:scratchpad
        no_screen_share = true
}

windowrule {
        name = blueman
        match:class = .*(blueman).*
        workspace = special:scratchpad
}

windowrule {
        name = audio
        match:class = org.rncbc.qpwgraph
        workspace = special:scratchpad
}

windowrule {
        name = torrent
        match:class = .*(qBittorrent).*
        workspace = special:scratchpad
}

##################
### WORKSPACES ###
##################

# https://wiki.hypr.land/Configuring/Workspace-Rules/
workspace = 1, on-created-empty:$TERMINAL -e tmux new-session -A -s init
workspace = 2, on-created-empty:$BROWSER
workspace = 3, on-created-empty:$TERMINAL -e tmux new-session -A -s media
